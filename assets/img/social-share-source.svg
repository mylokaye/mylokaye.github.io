<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Mylo Kaye — Dynamics 365 Customer Insights tools</title>
  <desc id="description">Social sharing artwork for Mylo Kaye's portfolio of Dynamics 365 Customer Insights tools and practical guides.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030711" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#050b16" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#07111d" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000814" flood-opacity="0.75"/>
    </filter>
  </defs>

  <image x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" href="social-background.png" xlink:href="social-background.png"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#shade)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#164e63" stroke-opacity="0.5" stroke-width="2"/>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(72 64)">
      <rect width="64" height="64" rx="16" fill="#0e7490"/>
      <text x="32" y="43" fill="#ecfeff" font-size="30" font-weight="800" text-anchor="middle">MK</text>
      <text x="84" y="29" fill="#f8fafc" font-size="26" font-weight="750">Mylo Kaye</text>
      <text x="84" y="55" fill="#67e8f9" font-size="17" font-weight="650" letter-spacing="1.2">MYLOKAYE.INFO</text>
    </g>

    <rect x="72" y="183" width="218" height="38" rx="19" fill="#083344" stroke="#22d3ee" stroke-opacity="0.72"/>
    <text x="181" y="208" fill="#a5f3fc" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="1.5">OPEN-SOURCE TOOLS</text>

    <text x="72" y="303" fill="#f8fafc" font-size="65" font-weight="800" letter-spacing="-1.7">Dynamics 365</text>
    <text x="72" y="375" fill="#f8fafc" font-size="65" font-weight="800" letter-spacing="-1.7">Customer Insights</text>
    <rect x="72" y="408" width="532" height="6" rx="3" fill="url(#rule)"/>

    <text x="72" y="472" fill="#cbd5e1" font-size="27" font-weight="500">Tools and practical guides for forms,</text>
    <text x="72" y="510" fill="#cbd5e1" font-size="27" font-weight="500">testing and campaign operations.</text>

    <text x="72" y="575" fill="#67e8f9" font-size="18" font-weight="700" letter-spacing="0.7">FORM DEBUGGING  •  CAMPAIGN OPERATIONS  •  SAFE WORKFLOWS</text>
  </g>
</svg>
